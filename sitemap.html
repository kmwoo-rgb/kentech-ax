<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사이트맵 | KENTECH AX대학원</title>
  <meta name="description" content="KENTECH AX대학원 홈페이지의 전체 메뉴를 한눈에 확인하세요.">
  <link rel="icon" type="image/svg+xml" href="assets/images/kentech_symbol.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611022420">
</head>
<body data-desc="홈페이지의 전체 메뉴를 한눈에 확인하고 바로 이동할 수 있습니다.">

  <div id="site-header"></div>
  <div id="site-subhead"></div>

  <main id="main" class="page-main">
    <div class="container content-sitemap">
      <div class="sm-grid" id="smGrid"></div>
      <div class="sm-etc" id="smEtc"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-overlays"></div>

  <script src="js/components.js?v=202611090915"></script>
  <script src="js/main.js?v=202611022420"></script>
  <script>
    (function () {
      var esc = function (s) { return s.replace(/&/g, '&amp;'); };
      var link = function (c) {
        var pending = c.href.indexOf('page.html') === 0;
        return '<li><a href="' + c.href + '"><span>' + esc(c.label) + '</span>' +
          (pending ? '<span class="sm-badge">작성중</span>' : '') + '</a></li>';
      };

      document.getElementById('smGrid').innerHTML = window.SITE_MENU.map(function (m) {
        return '<section class="sm-group"><h2><a href="' + m.children[0].href + '">' + esc(m.label) +
          '</a><small>' + m.en + '</small></h2><ul>' + m.children.map(link).join('') + '</ul></section>';
      }).join('');

      var etc = window.SITE_FOOTER_LINKS.filter(function (l) { return l.href.indexOf('sitemap.html') < 0; });
      document.getElementById('smEtc').innerHTML =
        '<section class="sm-group"><h2>기타</h2><ul>' + etc.map(link).join('') + '</ul></section>';
    })();
  </script>
</body>
</html>
